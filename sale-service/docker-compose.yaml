services:
  postgres:
    image: postgres:17
    container_name: sale-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sale-db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5437:5432"
    volumes:
      - sale_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sale-db"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  sale_postgres_data:
