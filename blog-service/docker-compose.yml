
services:
  postgres:
    image: postgres:17
    container_name: go-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: go_blog_mvc_app
    ports:
      - "5420:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d go_blog_mvc_app"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
